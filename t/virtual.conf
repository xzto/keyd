[ids]
*

[main]
f1 = oneshot(magic-caps)
f2 = layer(symbols)
f3 = layer(first)
f4 = layer(second)
f5 = toggle(first)
f6 = layer(shifted-symbols)
f7 = layer(shift-virtual)
f8 = setlayout(alternate)
f9 = setlayout(main)
f10 = macro(minus)
f11 = timeout(minus, 10, minus)
q = S-minus
w = C-minus
x = noop
g+h = minus

[keep]

[magic-caps]
virtual minus = oneshotm(magic-caps, minus)
virtual a = oneshotm(magic-caps, A)

[symbols]
a = minus
z = macro( 0 minus = )

[first]
virtual minus = oneshotm(keep, b)

[second]
virtual minus = oneshotm(keep, c)

[shifted-symbols:S]
a = minus

[shift-virtual]
virtual S-minus = oneshotm(keep, z)

[alternate:layout]
a = minus
virtual minus = oneshotm(keep, y)

[first+symbols]
v = minus
