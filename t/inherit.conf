[ids]
*

[main]
inherit a = lettermod(meta, inherit, 150, 200)
inherit s = lettermod(alt, inherit, 150, 200)
f1 = oneshot(magic-caps)
f2 = layer(number)
f3 = layer(nav)
f4 = layer(custom)
f5 = layer(shifted)
f6 = oneshot(legacy-caps)
f7 = setlayout(alternate)
f8 = setlayout(main)
f9 = layer(shift)
f10 = layer(disabled)

[number]
a = 1
s = S-minus

[nav]
a = noop
s = noop

[disabled]
a = noinherit(noop)

[custom]
a = lettermod(control, x, 100, 250)
s = macro(y)

[shifted:S]
a = minus

[legacy-caps]
a = oneshotm(legacy-caps, S-a)
s = oneshotm(legacy-caps, S-s)

[magic-caps]
virtual a = oneshotm(magic-caps, S-a)
virtual 1 = oneshotm(magic-caps, 1)
virtual S-minus = oneshotm(magic-caps, S-minus)

[alternate:layout]
a = b
s = c

[number+nav]
a = minus
