[ids]
*

[main]
j+k = esc
a+b+c = tab
a+b = enter
d+f = delete
f1 = layer(numbers)
f2 = layer(rebind)
f3 = layer(overlap)
f4 = layer(unmask)
f5 = toggle(numbers)
f6 = oneshot(numbers)
f7 = layer(nested)
f8 = layer(reverse)
f9 = layer(overridden)
f10 = layer(replacement)
space = overloadi(space, overloadt(nav, space, 200), 150)

[nav]
j+k = unbind
j = down
k = up
z = overloadt2(numbers, toggle(numbers), 200)

[numbers]
j+k = unbind
j = 4
k = 5
l = 6

[rebind]
j+k = tab

[overlap]
a+b+c = backspace
a+b = unbind

[unmask]
j+k = unbind
k+j = esc

[nested]
j+k = unbind
j = 1
k = 2

[reverse]
k+j = unbind
j = 4
k = 5

[overridden]
j+k = esc
j+k = unbind

[replacement]
j+k = unbind
k+j = tab
