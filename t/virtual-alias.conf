[ids]
*

[aliases]
102nd = z
z = x
x = tap-group
c = tap-group
a = s
v = a

[main]
f1 = oneshot(magic-caps)
f2 = layer(symbols)
inherit a = lettermod(meta, inherit, 150, 200)

[symbols]
tap-group = minus
x = equal

[magic-caps]
virtual z = oneshotm(magic-caps, S-z)
virtual x = oneshotm(magic-caps, S-x)
virtual s = oneshotm(magic-caps, S-s)
virtual minus = oneshotm(magic-caps, minus)
